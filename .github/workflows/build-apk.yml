name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          export KEYSTORE_FILE="$RUNNER_TEMP/release.p12"
          gradle :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk MyDhikr.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MyDhikr-apk
          path: MyDhikr.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: My Dhikr (build ${{ github.run_number }})
          body: Download MyDhikr.apk below and open it on your Android phone to install. New builds install over the old one and keep your data.
          files: MyDhikr.apk
          make_latest: true
